[package]
name = "chronoscope"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal viewer for AI coding-agent session histories"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "chronoscope"
path = "src/main.rs"

[dependencies]
tuirealm = { version = "4.1", features = ["crossterm"] }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
textwrap = "0.16"
unicode-width = "0.2"
unicode-segmentation = "1"
tui-input = "0.15"
arboard = "3"
base64 = "0.22"
nucleo = "0.5"
clap = { version = "4", features = ["derive"] }
etcetera = "0.11"
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
similar = "2"
chrono = "0.4"
log = { version = "0.4", features = ["std"] }
anyhow = "1"
shell-words = "1.1.1"
ctrlc = { version = "3.5.2", features = ["termination"] }

[dev-dependencies]
insta = "1"
criterion = "0.7"
tempfile = "3"
proptest = "1.11.0"

[target.'cfg(unix)'.dev-dependencies]
expectrl = "0.9"
