[package]
name = "chronoscope"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal viewer for AI coding-agent session histories"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "chronoscope"
path = "src/main.rs"

[dependencies]
tuirealm = { version = "4.1", features = ["crossterm"] }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
textwrap = "0.16"
unicode-width = "0.2"
tui-input = "0.15"
arboard = "3"
nucleo = "0.5"
clap = { version = "4", features = ["derive"] }
etcetera = "0.11"
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
similar = "2"

[dev-dependencies]
insta = "1"
criterion = "0.7"
