[package]
name = "chronoscope"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
description = "A terminal viewer for AI coding-agent session histories"
authors = ["Jacob Lauemøller <jacob.lauemoeller@iteray.com>"]
repository = "https://github.com/jlauemoeller/chronoscope"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "chronoscope"
path = "src/main.rs"

[dependencies]
tuirealm = { version = "4.1", features = ["crossterm"] }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "1.2"
toml_edit = "0.25"
rusqlite = { version = "0.41", features = ["bundled"] }
notify = "8"
textwrap = "0.16"
unicode-width = "0.2"
unicode-segmentation = "1"
tui-input = "0.15"
arboard = "3"
base64 = "0.23.1"
nucleo = "0.5"
clap = { version = "4", features = ["derive"] }
etcetera = "0.11"
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
similar = "3.2"
chrono = "0.4"
log = { version = "0.4", features = ["std"] }
anyhow = "1"
shell-words = "1.1.1"
ctrlc = { version = "3.5.2", features = ["termination"] }

[dev-dependencies]
insta = "1"
criterion = "0.8.2"
tempfile = "3"
proptest = "1.11.0"
serde_yaml_ng = "0.10.0"

[target.'cfg(unix)'.dev-dependencies]
expectrl = "0.9"

[[bench]]
name = "first_content"
harness = false

[[bench]]
name = "full_parse"
harness = false

[[bench]]
name = "frame_render"
harness = false

[[bench]]
name = "selector_index"
harness = false

[[bench]]
name = "session_stats"
harness = false

[lints.clippy]
mod_module_files = "deny"

[profile.release]
strip = true

# Packaging, see scripts/package.sh. With `--target`, both tools look for
# `target/release/chronoscope` under `target/<triple>/release/` instead.
[package.metadata.deb]
section = "utils"
license-file = "LICENSE"
# Without this, cargo-deb puts the whole README in the package description.
extended-description = "Lists the sessions of your projects and opens one as a transcript of turns that you can fold, search, copy, save and export, with live updates while the session is still running."
assets = [
    ["target/release/chronoscope", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/chronoscope/", "644"],
    ["THIRD-PARTY-NOTICES.md", "usr/share/doc/chronoscope/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/chronoscope", dest = "/usr/bin/chronoscope", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/chronoscope/LICENSE", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/chronoscope/README.md", mode = "644" },
    { source = "THIRD-PARTY-NOTICES.md", dest = "/usr/share/doc/chronoscope/THIRD-PARTY-NOTICES.md", mode = "644" },
]
