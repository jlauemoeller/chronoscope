name: CI

# Checks a commit on Linux. ci-macos.yml calls this workflow to run the same
# checks on macOS, and explains why that is separate.

on:
  # Branches only: for a tag, release.yml runs this workflow itself.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      os:
        description: The runner to check on, if not Linux.
        type: string
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ inputs.os || 'ubuntu-latest' }})
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast
      # The benchmarks only have to keep compiling; the budgets are checked by
      # hand (doc/performance.md).
      - run: cargo bench --no-run
