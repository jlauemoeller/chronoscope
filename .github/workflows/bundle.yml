name: Bundle

# Builds the .deb and .rpm packages for every commit on main that passed CI and
# keeps them as workflow artifacts. The targets and runners match the Linux
# builds in release.yml, and as there, there is deliberately no build cache.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  bundle:
    name: bundle (${{ matrix.target }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      # Build the exact commit that went green, not whatever main points at now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/packaging-tools

      - name: Build .deb and .rpm packages
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/package.sh "${TARGET}"

      - uses: actions/upload-artifact@v4
        with:
          name: chronoscope-${{ github.event.workflow_run.head_sha || github.sha }}-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/debian/*.deb
            target/${{ matrix.target }}/generate-rpm/*.rpm
          if-no-files-found: error
