name: Bundle

# Builds the .deb and .rpm packages for every commit on main that passed CI and
# keeps them as workflow artifacts, for trying out a commit without a release.
# The runner matches the Linux build in release.yml. Unlike there, a build cache
# is fine, because nothing built here is published. It also keeps the packaging
# tools, so rust-cache has to come before they are installed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  bundle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-22.04
    steps:
      # Build the exact commit that went green, not whatever main points at now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/packaging-tools

      - name: Build .deb and .rpm packages
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: chronoscope-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          if-no-files-found: error
