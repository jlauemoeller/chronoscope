name: Release

# Builds the binaries for a tag like `v0.1.0` and uploads them to the GitHub
# release of that tag (created when it does not exist yet). Hand-written
# instead of generated by `cargo-dist`, to keep the pipeline small. The Linux
# builds run on Ubuntu 22.04 so that the binaries need only glibc 2.35. There
# is deliberately no build cache: release builds are rare, and a cache
# written by another ref should not flow into the published binaries.

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check that the tag matches the crate version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="chronoscope-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/${name}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp "target/${TARGET}/release/chronoscope.exe" "dist/${name}/"
          else
            cp "target/${TARGET}/release/chronoscope" "dist/${name}/"
          fi
          cp README.md THIRD-PARTY-NOTICES.md "dist/${name}/"
          # The project's own licence file is shipped once there is one.
          for licence in LICENSE*; do
            if [ -f "${licence}" ]; then cp "${licence}" "dist/${name}/"; fi
          done
          cd dist
          if [ "${RUNNER_OS}" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${name}' -DestinationPath '${name}.zip'"
            echo "asset=${name}.zip" >> "${GITHUB_OUTPUT}"
          else
            tar -czf "${name}.tar.gz" "${name}"
            echo "asset=${name}.tar.gz" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    name: upload to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create the release if needed and upload the archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l assets
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            prerelease=""
            case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
            gh release create "${GITHUB_REF_NAME}" ${prerelease} --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" assets/* --clobber
