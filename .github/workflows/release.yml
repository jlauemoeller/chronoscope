name: Release

# Runs CI for a tag like `v0.1.0`, then builds the binaries, plus .deb and .rpm
# packages on Linux, and uploads them to the GitHub release of that tag. A
# release that does not exist yet is created as a draft, to review and publish
# by hand; doc/releasing.md has the steps. Hand-written instead of generated by
# `cargo-dist`, to keep the pipeline small. The Linux build runs on Ubuntu 22.04
# so that the binary needs only glibc 2.35. There is deliberately no build
# cache: release builds are rare, and a cache written by another ref should not
# flow into the published binaries.
#
# Linux decides whether there is a release. macOS only decides whether it has
# macOS files, because GitHub's macOS runners are often short of capacity (see
# ci-macos.yml). Without them the draft is still created, this run shows as
# failed, and re-running the failed jobs adds the files to the draft.

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Fail fast if the tag does not match the version the builds will carry.
  version:
    name: check the tag against the crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the crate version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  ci-macos:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      os: macos-latest

  build-linux:
    name: build (x86_64-unknown-linux-gnu)
    needs: ci
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build
        run: cargo build --release --locked --target "${TARGET}"

      - uses: ./.github/actions/packaging-tools

      - name: Build .deb and .rpm packages
        run: scripts/package.sh "${TARGET}"

      - name: Package
        run: |
          name="chronoscope-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/chronoscope" "dist/${name}/"
          cp README.md THIRD-PARTY-NOTICES.md LICENSE "dist/${name}/"
          cp "target/${TARGET}/debian/"*.deb "target/${TARGET}/generate-rpm/"*.rpm dist/
          cd dist
          tar -czf "${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TARGET }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  build-macos:
    name: build (${{ matrix.target }})
    needs: ci-macos
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target "${TARGET}"

      - name: Package
        run: |
          name="chronoscope-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/chronoscope" "dist/${name}/"
          cp README.md THIRD-PARTY-NOTICES.md LICENSE "dist/${name}/"
          cd dist
          tar -czf "${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: upload to the GitHub release
    # build-macos is listed although it may fail, so that re-running it also
    # re-runs this job, which adds its files to the release. Only `always()`
    # lets this job run after a macOS job was cancelled for lack of a runner.
    needs: [build-linux, build-macos]
    if: always() && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Warn that macOS files are missing
        if: needs.build-macos.result != 'success'
        run: echo "::warning title=macOS files missing::Some macOS jobs did not succeed. Re-run the failed jobs to add their files to the release; see doc/releasing.md."

      - name: Create a draft release if needed and upload the files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l assets
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            prerelease=""
            case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
            gh release create "${GITHUB_REF_NAME}" ${prerelease} --draft --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" assets/* --clobber
