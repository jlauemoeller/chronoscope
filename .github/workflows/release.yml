name: Release

# Runs CI for a tag like `v0.1.0`, then builds the binaries, plus .deb and .rpm
# packages on Linux, and uploads them to the GitHub release of that tag. A
# release that does not exist yet is created as a draft, to review and publish
# by hand. Hand-written instead of generated by `cargo-dist`, to keep the
# pipeline small. The Linux builds run on Ubuntu 22.04 so that the binaries need
# only glibc 2.35. There is deliberately no build cache: release builds are
# rare, and a cache written by another ref should not flow into the published
# binaries.

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Fail fast if the tag does not match the version the builds will carry.
  version:
    name: check the tag against the crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the crate version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - if: runner.os == 'Linux'
        uses: ./.github/actions/packaging-tools

      - name: Build .deb and .rpm packages
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/package.sh "${TARGET}"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="chronoscope-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/${name}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp "target/${TARGET}/release/chronoscope.exe" "dist/${name}/"
          else
            cp "target/${TARGET}/release/chronoscope" "dist/${name}/"
          fi
          cp README.md THIRD-PARTY-NOTICES.md LICENSE "dist/${name}/"
          if [ "${RUNNER_OS}" = "Linux" ]; then
            cp "target/${TARGET}/debian/"*.deb "target/${TARGET}/generate-rpm/"*.rpm dist/
          fi
          cd dist
          if [ "${RUNNER_OS}" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${name}' -DestinationPath '${name}.zip'"
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    name: upload to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create a draft release if needed and upload the files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l assets
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            prerelease=""
            case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
            gh release create "${GITHUB_REF_NAME}" ${prerelease} --draft --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" assets/* --clobber
