<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factory Board</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js"
          integrity="sha512-rCQgmUulW6f6QegOvTntKKb5IAoxTpGVCdWqYjkXEpzAns6XUFs8NKVqWe+KQpctp/EoRSFSuykVputqknLYMg=="
          crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="loop">
      <span id="loop-state" class="state">loading</span>
      <span id="loop-message" class="message"></span>
    </div>
    <nav id="run-files" class="run-files" aria-label="Run files"></nav>
    <div class="meta">
      <span id="stale" class="stale" hidden></span>
      <span id="updated" class="updated"></span>
    </div>
  </header>

  <main id="board" class="board"></main>

  <aside id="panel" class="panel" hidden aria-labelledby="panel-title">
    <div id="panel-resize" class="resize" role="separator" aria-orientation="vertical"
         aria-label="Resize the panel" tabindex="0"></div>
    <div class="panel-inner">
      <div class="panel-head">
        <h2 id="panel-title"></h2>
        <button id="panel-close" class="close" type="button" aria-label="Close the panel">×</button>
      </div>
      <ul id="panel-files" class="files"></ul>
      <div class="viewer-head">
        <span id="viewer-path" class="viewer-path"></span>
        <span id="viewer-status" class="viewer-status"></span>
      </div>
      <article id="viewer" class="viewer"></article>
    </div>
  </aside>
</body>
</html>
