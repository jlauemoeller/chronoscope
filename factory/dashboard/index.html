<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factory board</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.11/marked.min.js"
          integrity="sha512-OTmDnatwFtpx21xsHvxZdpqKcy9IxqlYSS1Qb0eZBvrwSarxkSYxT/HunpwjWAkaS069Q87iNafdft1oIKf1Qg=="
          crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"
          integrity="sha512-YlctBG9PGZIhh9keoqI3eZkQM9T8QUbiBi7qNYAO/TUEo8jqWX5pLp5+x1cKRQDRzJ/lyGyJ9WUVNIRduxIIFw=="
          crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>Factory</h1>
      <span id="loop-state" class="loop-state">loading</span>
      <span id="loop-message" class="loop-message"></span>
    </div>
    <div class="top-row secondary">
      <nav id="run-files" class="run-files" aria-label="Run files"></nav>
      <span id="updated" class="updated"></span>
    </div>
    <div id="stale" class="stale" role="status" hidden></div>
  </header>

  <main id="board" class="board" aria-label="Tasks by stage"></main>

  <aside id="panel" class="panel" aria-labelledby="panel-title" hidden>
    <div id="panel-resize" class="panel-resize" role="separator" tabindex="0"
         aria-orientation="vertical" aria-label="Resize panel"></div>
    <div class="panel-inner">
      <div class="panel-head">
        <h2 id="panel-title"></h2>
        <button id="panel-close" class="panel-close" type="button" aria-label="Close panel">×</button>
      </div>
      <ul id="panel-files" class="file-list"></ul>
      <div id="panel-view" class="file-view" tabindex="-1"></div>
    </div>
  </aside>
</body>
</html>
