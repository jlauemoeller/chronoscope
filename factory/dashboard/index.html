<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factory Board</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="loop">
      <span id="loop-state" class="badge state-none">no board</span>
      <span id="loop-message" class="loop-message">Waiting for factory/state/board.json</span>
    </div>
    <div class="meta">
      <nav id="run-files" class="run-files" aria-label="Run files"></nav>
      <span id="updated" class="updated"></span>
    </div>
  </header>

  <main id="board" class="board" aria-live="polite"></main>

  <aside id="panel" class="panel" hidden aria-label="Files">
    <div id="panel-handle" class="panel-handle" title="Drag to resize"></div>
    <div class="panel-inner">
      <div class="panel-head">
        <div>
          <div id="panel-title" class="panel-title"></div>
          <div id="panel-subtitle" class="panel-subtitle"></div>
        </div>
        <button id="panel-close" class="icon-button" type="button" aria-label="Close panel">&times;</button>
      </div>
      <ul id="panel-files" class="panel-files"></ul>
      <div id="panel-view" class="panel-view"></div>
    </div>
  </aside>
</body>
</html>
