<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factory board</title>
  <link rel="stylesheet" href="style.css">
  <!-- Markdown rendering and sanitizing, pinned and checked by hash. If either
       fails to load, files show as preformatted text instead. -->
  <script defer
    src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.1.3/lib/marked.umd.min.js"
    integrity="sha384-lFrK5CitYysybAqlfGWzSr4wxMI/Ok44hlfKtPAFt1q6F4xSK/6mTiKDfcw/GZO5"
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script defer
    src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.17/purify.min.js"
    integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx"
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1 class="brand">Factory</h1>
      <span class="loop-state" id="loop-state">loading</span>
      <span class="loop-message" id="loop-message"></span>
      <nav class="run-files" id="run-files" aria-label="Run files"></nav>
    </div>
    <div class="top-row meta">
      <span id="updated"></span>
      <span class="stale" id="stale" hidden></span>
    </div>
  </header>

  <main class="board" id="board" aria-label="Tasks by stage"></main>

  <aside class="panel" id="panel" hidden aria-label="Files">
    <div class="panel-handle" id="panel-handle" role="separator"
         aria-orientation="vertical" aria-label="Resize panel" tabindex="0"></div>
    <div class="panel-inner">
      <div class="panel-head">
        <div class="panel-title">
          <span class="panel-context" id="panel-context"></span>
          <span class="panel-path" id="panel-path"></span>
        </div>
        <button type="button" class="panel-close" id="panel-close"
                aria-label="Close panel" title="Close (Esc)">&times;</button>
      </div>
      <div class="panel-body">
        <nav class="file-list" id="file-list" aria-label="Task files"></nav>
        <div class="viewer" id="viewer">
          <div class="viewer-note" id="viewer-note" hidden></div>
          <div class="viewer-content" id="viewer-content"></div>
        </div>
      </div>
    </div>
  </aside>
</body>
</html>
