<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factory board</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js"
          integrity="sha512-rCQgmUulW6f6QegOvTntKKb5IAoxTpGVCdWqYjkXEpzAns6XUFs8NKVqWe+KQpctp/EoRSFSuykVputqknLYMg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">Factory</div>
    <div class="loop">
      <span id="loop-state" class="state">loading</span>
      <span id="loop-message" class="message"></span>
    </div>
    <div class="meta">
      <span id="loop-current"></span>
      <span id="updated"></span>
    </div>
  </header>

  <main id="board" class="board" aria-label="Task board"></main>

  <aside id="panel" class="panel" hidden aria-label="Task files">
    <div id="panel-resize" class="panel-resize" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
    <div class="panel-inner">
      <div class="panel-head">
        <div>
          <div id="panel-id" class="mono muted"></div>
          <div id="panel-title" class="panel-title"></div>
        </div>
        <button id="panel-close" class="close" type="button" aria-label="Close">×</button>
      </div>
      <nav id="panel-files" class="files"></nav>
      <article id="panel-doc" class="doc"></article>
    </div>
  </aside>
</body>
</html>
